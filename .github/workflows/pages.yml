name: Deploy to GitHub Pages

# Requires Settings → Pages → Source = "GitHub Actions" (set once, by hand).
# Note for anyone tempted to automate that: actions/configure-pages has an
# `enablement: true` option that turns Pages on itself, but it needs an
# `administration` permission that GITHUB_TOKEN cannot be granted —
# `administration` is not in the allowed permissions list, so adding it makes the
# whole workflow file unparseable and the run fails before any job starts.
# Enabling Pages from a workflow needs a PAT with admin rights, which is not worth
# storing a long-lived admin token for a one-time switch.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
